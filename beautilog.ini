[logger]
name = server
save_to_file = true
log_level = INFO
suppress_other_loggers = true
disabled_loggers = ["uvicorn", "uvicorn.access", "uvicorn.error", "fastapi"]

[file_logger]
log_file_path = server.log
backup_count = 5
max_bytes = 104857600
log_level = INFO

[custom_levels]
REQUEST = 25
RESPONSE = 26
DATA = 24

[level_colors]
CRITICAL = RED
ERROR = BRIGHT_RED
WARNING = YELLOW
INFO = CYAN
REQUEST = BRIGHT_MAGENTA
RESPONSE = BRIGHT_GREEN
DATA = BRIGHT_BLUE
DEFAULT = RESET
