[logger]
name = registry
save_to_file = true
log_level = DEBUG
suppress_other_loggers = true
disabled_loggers = ["uvicorn", "uvicorn.error", "uvicorn.access", "fastapi", "asyncio", "urllib3"]

[file_logger]
log_file_path = server.log
backup_count = 3
max_bytes = 10485760
log_level = DEBUG

[custom_levels]
GETREQ = 15
POSTREQ = 14
PUTREQ = 13
DELREQ = 12
PAYLOAD = 11

[level_colors]
CRITICAL = BRIGHT_RED
ERROR = RED
WARNING = YELLOW
INFO = CYAN
DEBUG = BLUE
GETREQ = GREEN
POSTREQ = CYAN
PUTREQ = YELLOW
DELREQ = RED
PAYLOAD = MAGENTA
DEFAULT = RESET
