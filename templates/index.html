<!DOCTYPE html>
<html>
<head>
  <title>Trustworthy Model Registry – Reliability Track</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Model Registry (Reliability Track)</h2>
    <p><a href="/tracks" class="btn btn-secondary btn-sm">View Track JSON</a></p>
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Dataset</th>
          <th>Code</th>
        </tr>
      </thead>
      <tbody>
        {% for m in models %}
        <tr>
          <td>{{ m.name }}</td>
          <td>{{ m.score }}</td>
          <td><a href="{{ m.dataset_url }}" target="_blank">{{ m.dataset_url }}</a></td>
          <td><a href="{{ m.code_url }}" target="_blank">{{ m.code_url }}</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
