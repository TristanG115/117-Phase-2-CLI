name: CI/CD Pipeline

on:
  push:
    branches: [main, ec2]
  pull_request:
    branches: [main, ec2]
  workflow_dispatch: 


jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 isort black mypy pytest coverage requests

      - name: Lint code
        run: flake8 .

      - name: Check import order
        run: isort . --check-only --profile black --line-length 120

      - name: Check formatting
        run: black --check --line-length 120 .

      - name: Type checking
        run: mypy . --check-untyped-defs

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report -m --fail-under=90

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy SSH key from secret
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key-pair.pem
          chmod 400 ec2-key-pair.pem

      - name: Deploy code to EC2
        run: |
          ssh -i ec2-key-pair.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user
            if [ ! -d "117-Phase-2-CLI" ]; then
              git clone https://github.com/TristanG115/117-Phase-2-CLI.git
            fi
            cd 117-Phase-2-CLI
            git pull origin main
            echo "Restarting app..."
            pkill -f "python3 main.py" || true
            nohup python3 main.py > app.log 2>&1 &
          EOF
