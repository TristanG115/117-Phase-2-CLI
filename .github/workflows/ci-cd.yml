name: CI/CD Pipeline

on:
  push:
    branches: [main, ec2]
  pull_request:
    branches: [main, ec2]
  workflow_dispatch: 


jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 isort black mypy pytest coverage requests

      - name: Lint code
        run: flake8 .

      - name: Check import order
        run: isort . --check-only --profile black --line-length 120

      - name: Check formatting
        run: black --check --line-length 120 .

      - name: Type checking
        run: mypy . --check-untyped-defs

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report -m --fail-under=90

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ec2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy SSH key from secret
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > new-ec2-key.pem
          chmod 600 new-ec2-key.pem
      
      - name: Debug key hash in Actions
        run: shasum new-ec2-key.pem

      - name: Deploy code to EC2
        run: |
          ssh -i new-ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user
            if [ ! -d "117-Phase-2-CLI" ]; then
              git clone https://github.com/TristanG115/117-Phase-2-CLI.git
            fi
            git reset --hard
            git pull origin main

            pip3 install --user -r requirements.txt

            python3 run.py install

            echo "Deployment completed successfully."
          EOF
